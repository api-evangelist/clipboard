aid: clipboard
name: Clipboard Health
description: >-
  Clipboard Health (which also operates as "Clipboard" / Clipboard Works) is a
  Y Combinator (W17) and Andreessen Horowitz backed healthcare workforce
  marketplace that connects healthcare facilities with qualified, credentialed
  professionals to fill open shifts. Workplaces post open shifts and Clipboard
  matches them with local nurses, CNAs, caregivers, and allied professionals,
  handling scheduling, replacement coverage when a worker cancels, credential
  verification, and payments. The platform serves long-term care, home health
  and hospice, hospitals, and dental practices, with more than 6,500 workplaces
  and roughly one million workers across the United States. Clipboard Health is
  a marketplace/product company rather than an API-first developer platform; it
  publishes no public product API, OpenAPI, or developer portal, but it does
  operate an active open-source engineering presence (the ClipboardHealth
  GitHub organization and the @clipboard-health npm scope) and a published
  security contact. This profile was surfaced as an a16z / Y Combinator
  portfolio lead and enriched from public sources.
